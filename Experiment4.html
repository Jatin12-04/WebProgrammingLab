<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment4</title>
</head>
<body>
    <h1 align="center">Hotel Booking Form</h1>
    <form align="center">
        <label for="Full Name">Full Name :</label>
        <input type="text" name="Full Name" id="Full Name">
        <br><br>
        <label for="email">Email :</label>
        <input type="text" name="#" id="Email">
        <br><br>
        <label for="Phone no.">Phone No. :</label>
        <input type="tel" name="Phone No." id= "Phone No.">
        <br><br>
        <label for="CheckIn">Check In Date :</label>
        <input type="date" name="CheckIn" id="CheckIn">
        <br><br>
        <label for="CheckOut">Check Out Date :</label>
        <input type="date" name="CheckOut" id="CheckOut">
        <br><br>
        <label for="RoomType">Room Type :</label>
        <select name="Roomtype" id="Roomtype">
        <option value="Single">Single</option>        
        <option value="Double">Double</option>
        <option value="Luxury">Luxury</option> 
        <option value="Sulte">Suite</option>
        </select>
        <br><br>
        <label for="Guest">No. of Guest :</label>
        <input type="number" name ="Guest" id="Guest" min="1" max="10">
        <br><br>
         <label for="Request">Special Request</label>
         <br>
         <textarea name="Guest" id = "Guest" rows="4" cols="50">
         </textarea>
         <br><br>
         <button type="submit" value="Book Now">Book Now</button>
         <button type="submit" value="Reset Form">Reset Form</button>
    </form>
</body>
</html>
